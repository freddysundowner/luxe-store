openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: WhatsApp-style ecommerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: settings
    description: Store settings
  - name: admin
    description: Admin operations
  - name: gifts
    description: Gift operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found

  /admin/categories:
    post:
      operationId: createCategory
      tags: [admin, categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    put:
      operationId: updateCategory
      tags: [admin, categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [admin, categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin, products]
      summary: List all products (admin)
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin, products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /admin/products/{id}:
    put:
      operationId: updateProduct
      tags: [admin, products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      tags: [admin, products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get store settings
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate M-Pesa STK push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitiateBody"
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitiateResponse"
        "400":
          description: Bad request
        "503":
          description: SunPay not configured

  /payments/{transactionId}/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Get payment status
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Not found

  /webhooks/sunpay:
    post:
      operationId: sunpayWebhook
      tags: [payments]
      summary: SunPay payment webhook
      responses:
        "200":
          description: OK

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin, payments]
      summary: List all payments (admin)
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPayment"

  /gifts:
    post:
      operationId: createGift
      tags: [gifts]
      summary: Create a gift (sender flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftInput"
      responses:
        "201":
          description: Gift created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /gifts/{token}:
    get:
      operationId: getGift
      tags: [gifts]
      summary: Get gift by claim token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"
        "404":
          description: Not found

  /gifts/{token}/claim:
    post:
      operationId: claimGift
      tags: [gifts]
      summary: Mark gift as claimed by recipient
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /admin/gifts:
    get:
      operationId: listAdminGifts
      tags: [gifts, admin]
      summary: List all gifts (admin)
      responses:
        "200":
          description: List of gifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"

  /admin/gifts/{id}/mark-paid:
    post:
      operationId: markGiftPaid
      tags: [gifts, admin]
      summary: Mark a gift as paid (admin or after WhatsApp checkout)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /admin/settings:
    put:
      operationId: updateSettings
      tags: [admin, settings]
      summary: Update store settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Unauthorized

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        productCount:
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string

    Product:
      type: object
      required: [id, name, price, inStock, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        originalPrice:
          type: ["number", "null"]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        inStock:
          type: boolean
        isActive:
          type: boolean
        isDropship:
          type: boolean
        isFeatured:
          type: boolean
        availabilityTag:
          type: ["string", "null"]
          description: "Custom availability tag: new, sale, hot, bestseller, limited, coming_soon"
        createdAt:
          type: ["string", "null"]
          format: date-time

    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        originalPrice:
          type: ["number", "null"]
        categoryId:
          type: integer
        imageUrl:
          type: string
        inStock:
          type: boolean
        isActive:
          type: boolean
        isDropship:
          type: boolean
        isFeatured:
          type: boolean
        availabilityTag:
          type: ["string", "null"]
          description: "Custom availability tag: new, sale, hot, bestseller, limited, coming_soon"

    PriceTier:
      type: object
      required: [name, min]
      properties:
        name:
          type: string
        min:
          type: number
        max:
          type: ["number", "null"]

    StoreSettings:
      type: object
      required: [storeName, whatsappNumber]
      properties:
        storeName:
          type: string
        storeDescription:
          type: ["string", "null"]
        whatsappNumber:
          type: string
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
        currencySymbol:
          type: string
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        sunpayEnabled:
          type: string
        sunpayApiKey:
          type: ["string", "null"]

    StoreSettingsInput:
      type: object
      required: [storeName, whatsappNumber]
      properties:
        storeName:
          type: string
        storeDescription:
          type: string
        whatsappNumber:
          type: string
        logoUrl:
          type: string
        currency:
          type: string
        currencySymbol:
          type: string
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        sunpayEnabled:
          type: string
        sunpayApiKey:
          type: string

    PaymentInitiateBody:
      type: object
      required: [phoneNumber, amount]
      properties:
        phoneNumber:
          type: string
          description: "Customer phone in format 254XXXXXXXXX"
        amount:
          type: number
          minimum: 1
        externalRef:
          type: string
        cartSnapshot:
          type: object

    PaymentInitiateResponse:
      type: object
      required: [success, transactionId]
      properties:
        success:
          type: boolean
        message:
          type: string
        transactionId:
          type: string
        checkoutRequestId:
          type: string

    PaymentStatusResponse:
      type: object
      required: [id, status, amount, phoneNumber]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        amount:
          type: number
        phoneNumber:
          type: string
        mpesaRef:
          type: ["string", "null"]
        createdAt:
          type: string

    AdminPayment:
      type: object
      required: [id, transactionId, phoneNumber, amount, status, createdAt]
      properties:
        id:
          type: integer
        transactionId:
          type: string
        phoneNumber:
          type: string
        amount:
          type: number
        status:
          type: string
        mpesaRef:
          type: ["string", "null"]
        externalRef:
          type: ["string", "null"]
        createdAt:
          type: string

    Gift:
      type: object
      required: [id, claimToken, productId, productName, productPrice, paymentMethod, status, createdAt]
      properties:
        id:
          type: integer
        claimToken:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productPrice:
          type: number
        productImageUrl:
          type: ["string", "null"]
        recipientName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [whatsapp, mpesa]
        paymentRef:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, claimed]
        claimedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    GiftInput:
      type: object
      required: [productId, productName, productPrice, paymentMethod]
      properties:
        productId:
          type: integer
        productName:
          type: string
        productPrice:
          type: number
        productImageUrl:
          type: string
        recipientName:
          type: string
        note:
          type: string
        senderName:
          type: string
        paymentMethod:
          type: string
          enum: [whatsapp, mpesa]
        paymentRef:
          type: string

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminAuthResult:
      type: object
      required: [token, success]
      properties:
        token:
          type: string
        success:
          type: boolean

    AdminStats:
      type: object
      required: [totalProducts, totalCategories, activeProducts, featuredProducts, dropshipProducts, outOfStockProducts]
      properties:
        totalProducts:
          type: integer
        totalCategories:
          type: integer
        activeProducts:
          type: integer
        featuredProducts:
          type: integer
        dropshipProducts:
          type: integer
        outOfStockProducts:
          type: integer
