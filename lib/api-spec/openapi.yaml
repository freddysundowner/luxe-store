openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: WhatsApp-style ecommerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: settings
    description: Store settings
  - name: admin
    description: Admin operations
  - name: gifts
    description: Gift operations
  - name: hampers
    description: Gift hampers (curated product bundles)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found

  /admin/categories:
    post:
      operationId: createCategory
      tags: [admin, categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    put:
      operationId: updateCategory
      tags: [admin, categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [admin, categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: kind
          in: query
          required: false
          description: "Filter by product kind. 'simple' = regular products. 'bundle' = curated gift sets (formerly hampers). Omit for all kinds."
          schema:
            type: string
            enum: [simple, bundle]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin, products]
      summary: List all products (admin)
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin, products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /admin/products/{id}:
    put:
      operationId: updateProduct
      tags: [admin, products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      tags: [admin, products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /hampers:
    get:
      operationId: listHampers
      tags: [hampers]
      summary: List active hampers (public)
      responses:
        "200":
          description: List of hampers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hamper"

  /hampers/{id}:
    get:
      operationId: getHamper
      tags: [hampers]
      summary: Get a hamper by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hamper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hamper"
        "404":
          description: Not found

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get store settings
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate M-Pesa STK push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitiateBody"
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitiateResponse"
        "400":
          description: Bad request
        "503":
          description: SunPay not configured

  /payments/{transactionId}/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Get payment status
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Not found

  /payments/{transactionId}/receipt:
    get:
      operationId: getPaymentReceipt
      tags: [payments]
      summary: Get full receipt for a payment
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceiptResponse"
        "404":
          description: Not found

  /webhooks/sunpay:
    post:
      operationId: sunpayWebhook
      tags: [payments]
      summary: SunPay payment webhook
      responses:
        "200":
          description: OK

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin, payments]
      summary: List all payments (admin)
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPayment"

  /gifts:
    post:
      operationId: createGift
      tags: [gifts]
      summary: Create a gift (sender flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftInput"
      responses:
        "201":
          description: Gift created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /gifts/{token}:
    get:
      operationId: getGift
      tags: [gifts]
      summary: Get gift by claim token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"
        "404":
          description: Not found

  /gifts/{token}/claim:
    post:
      operationId: claimGift
      tags: [gifts]
      summary: Mark gift as claimed by recipient
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /admin/gifts:
    get:
      operationId: listAdminGifts
      tags: [gifts, admin]
      summary: List all gifts (admin)
      responses:
        "200":
          description: List of gifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"

  /admin/gifts/{id}/mark-paid:
    post:
      operationId: markGiftPaid
      tags: [gifts, admin]
      summary: Mark a gift as paid (admin or after WhatsApp checkout)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /admin/availability-tags:
    get:
      operationId: listAvailabilityTags
      tags: [admin]
      summary: List all availability tags
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityTag"
    post:
      operationId: createAvailabilityTag
      tags: [admin]
      summary: Create a new availability tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityTagInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityTag"

  /admin/availability-tags/{id}:
    delete:
      operationId: deleteAvailabilityTag
      tags: [admin]
      summary: Delete an availability tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /availability-tags:
    get:
      operationId: listAvailabilityTagsPublic
      tags: [availability-tags]
      summary: List availability tags (public, for product form)
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityTag"

  /admin/settings:
    put:
      operationId: updateSettings
      tags: [admin, settings]
      summary: Update store settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Unauthorized

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        productCount:
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string

    ImageDisplaySettings:
      type: object
      required: [fit, focalX, focalY]
      description: "How a single product image should render in feeds, cards and the gallery."
      properties:
        fit:
          type: string
          enum: [cover, contain]
          description: "cover = crop to fill (default). contain = show the whole image with a blurred background filling the empty space."
        focalX:
          type: number
          minimum: 0
          maximum: 100
          description: "Horizontal focal point as a percentage (0=left, 100=right). Used as object-position when fit=cover."
        focalY:
          type: number
          minimum: 0
          maximum: 100
          description: "Vertical focal point as a percentage (0=top, 100=bottom). Used as object-position when fit=cover."

    ProductVariant:
      type: object
      required: [id, name, stockQuantity, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
          description: "Free-form variant label, e.g. 'Red — L' or 'XXL'."
        price:
          type: ["number", "null"]
          description: "Optional price override. When null, the parent product's price is used."
        stockQuantity:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        sortOrder:
          type: integer

    ProductVariantInput:
      type: object
      required: [name, stockQuantity]
      properties:
        id:
          type: integer
          description: "When present, updates an existing variant; otherwise a new one is created."
        name:
          type: string
          minLength: 1
        price:
          type: ["number", "null"]
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        sortOrder:
          type: integer

    BundleProductSummary:
      type: object
      required: [id, name, price, quantity]
      description: "Resolved component product inside a bundle. Read-only — server-built from bundleItems for client convenience."
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1

    Product:
      type: object
      required: [id, name, price, inStock, isActive, stockQuantity, variants, kind, bundleItems]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        originalPrice:
          type: ["number", "null"]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
          description: "Cover image URL. Convenience field — always equals images[0] when images is non-empty."
        images:
          type: array
          description: "Ordered gallery of image URLs. First entry is the cover."
          items:
            type: string
        imageSettings:
          type: object
          description: "Per-image display settings keyed by image URL. Missing entries default to cover/centre."
          additionalProperties:
            $ref: "#/components/schemas/ImageDisplaySettings"
        inStock:
          type: boolean
        stockQuantity:
          type: integer
          minimum: 0
          description: "Remaining inventory of the base product. 0 means out of stock. Ignored when variants are present or when kind=bundle (computed from items)."
        isActive:
          type: boolean
        isDropship:
          type: boolean
        isFeatured:
          type: boolean
        availabilityTag:
          type: ["string", "null"]
          description: "Custom availability tag: new, sale, hot, bestseller, limited, coming_soon"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        kind:
          type: string
          enum: [simple, bundle]
          description: "simple = regular product. bundle = curated gift set of other products."
        bundleItems:
          type: array
          description: "When kind=bundle, the configured items (productId + quantity). Empty for simple products."
          items:
            $ref: "#/components/schemas/HamperItem"
        bundleProducts:
          type: ["array", "null"]
          description: "When kind=bundle, server-resolved summaries for each component product (in item order). Null for simple products."
          items:
            $ref: "#/components/schemas/BundleProductSummary"
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
          description: "Last time the product row was modified. Sort key for the admin table."

    ProductInput:
      type: object
      required: [name, price, categoryId, stockQuantity]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        originalPrice:
          type: ["number", "null"]
        categoryId:
          type: integer
        imageUrl:
          type: string
          description: "Optional cover image URL. Ignored when 'images' is provided — images[0] becomes the cover."
        images:
          type: array
          description: "Ordered gallery of image URLs. First entry is treated as the cover."
          items:
            type: string
        imageSettings:
          type: object
          description: "Per-image display settings keyed by image URL. Optional — missing entries default to cover/centre."
          additionalProperties:
            $ref: "#/components/schemas/ImageDisplaySettings"
        inStock:
          type: boolean
        stockQuantity:
          type: integer
          minimum: 0
          description: "Remaining inventory. 0 means out of stock."
        isActive:
          type: boolean
        isDropship:
          type: boolean
        isFeatured:
          type: boolean
        availabilityTag:
          type: ["string", "null"]
          description: "Custom availability tag: new, sale, hot, bestseller, limited, coming_soon"
        variants:
          type: array
          description: "Optional variants. When provided, replaces the full set of variants for the product. Ignored when kind=bundle."
          items:
            $ref: "#/components/schemas/ProductVariantInput"
        kind:
          type: string
          enum: [simple, bundle]
          description: "Defaults to 'simple' when omitted."
        bundleItems:
          type: array
          description: "Required when kind=bundle. Each entry references an existing simple product by id with a quantity ≥ 1."
          items:
            $ref: "#/components/schemas/HamperItem"

    HamperItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    Hamper:
      type: object
      required: [id, name, price, items, isActive, isFeatured, inStock]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        price:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/HamperItem"
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        inStock:
          type: boolean
          description: "True when every component product has stock available."
        createdAt:
          type: ["string", "null"]
          format: date-time

    PriceTier:
      type: object
      required: [name, min]
      properties:
        name:
          type: string
        min:
          type: number
        max:
          type: ["number", "null"]

    StoreSettings:
      type: object
      required: [storeName, whatsappNumber]
      properties:
        storeName:
          type: string
        storeDescription:
          type: ["string", "null"]
        whatsappNumber:
          type: string
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
        currencySymbol:
          type: string
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        sunpayEnabled:
          type: string
        sunpayApiKey:
          type: ["string", "null"]
        brevoApiKey:
          type: ["string", "null"]
        brevoSenderEmail:
          type: ["string", "null"]
        brevoSenderName:
          type: ["string", "null"]
        salesNotificationEmail:
          type: ["string", "null"]
          description: "Optional internal sales address that is BCC'd on every order confirmation email."

    StoreSettingsInput:
      type: object
      required: [storeName, whatsappNumber]
      properties:
        storeName:
          type: string
        storeDescription:
          type: string
        whatsappNumber:
          type: string
        logoUrl:
          type: string
        currency:
          type: string
        currencySymbol:
          type: string
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        sunpayEnabled:
          type: string
        sunpayApiKey:
          type: string
        brevoApiKey:
          type: string
        brevoSenderEmail:
          type: string
        brevoSenderName:
          type: string
        salesNotificationEmail:
          type: string

    PaymentInitiateBody:
      type: object
      required: [phoneNumber, amount]
      properties:
        phoneNumber:
          type: string
          description: "Customer phone in format 254XXXXXXXXX"
        amount:
          type: number
          minimum: 1
        externalRef:
          type: string
        cartSnapshot:
          type: object

    PaymentInitiateResponse:
      type: object
      required: [success, transactionId]
      properties:
        success:
          type: boolean
        message:
          type: string
        transactionId:
          type: string
        checkoutRequestId:
          type: string

    PaymentReceiptResponse:
      type: object
      required: [transactionId, status, amount, phoneNumber, createdAt, storeName, currencySymbol]
      properties:
        transactionId:
          type: string
        externalRef:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, completed, failed]
        amount:
          type: number
        phoneNumber:
          type: string
        mpesaRef:
          type: ["string", "null"]
        cartSnapshot:
          type: object
          nullable: true
        createdAt:
          type: string
        storeName:
          type: string
        storeLogoUrl:
          type: ["string", "null"]
        currencySymbol:
          type: string

    PaymentStatusResponse:
      type: object
      required: [id, status, amount, phoneNumber]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        amount:
          type: number
        phoneNumber:
          type: string
        mpesaRef:
          type: ["string", "null"]
        createdAt:
          type: string

    AdminPayment:
      type: object
      required: [id, transactionId, phoneNumber, amount, status, createdAt]
      properties:
        id:
          type: integer
        transactionId:
          type: string
        checkoutRequestId:
          type: ["string", "null"]
        phoneNumber:
          type: string
        amount:
          type: number
        status:
          type: string
        mpesaRef:
          type: ["string", "null"]
        externalRef:
          type: ["string", "null"]
        cartSnapshot:
          type: object
          nullable: true
        updatedAt:
          type: string
        createdAt:
          type: string

    Gift:
      type: object
      required: [id, claimToken, productId, productName, productPrice, paymentMethod, status, createdAt]
      properties:
        id:
          type: integer
        claimToken:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productPrice:
          type: number
        productImageUrl:
          type: ["string", "null"]
        recipientName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [whatsapp, mpesa]
        paymentRef:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, claimed]
        claimedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

